global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "nzovu-dev"
    environment: "development"

# Load alerting rules
rule_files:
  - "/etc/prometheus/alerts.yml"

# Alertmanager configuration (optional - uncomment if you have alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

scrape_configs:
  # Nzovu metrics
  - job_name: "nzovu"
    static_configs:
      - targets: ["nzovu-server:8080"]
        labels:
          service: "nzovu"
          component: "server"
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: "/metrics"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # Add additional scrape targets here
  # Example for additional Nzovu instances:
  # - job_name: 'nzovu-prod'
  #   static_configs:
  #     - targets: ['nzovu-prod:9091']
  #       labels:
  #         service: 'nzovu'
  #         environment: 'production'
