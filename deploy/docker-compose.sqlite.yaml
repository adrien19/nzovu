
services:
  nzovusvc:
    container_name: nzovu-server
    hostname: nzovu-server
    build:
      context: ..
      dockerfile: ./images/Dockerfile.sqlite
    environment:
      - SERVER_MODE=development
      - STORAGE_TYPE=sqlite
      - SQLITE_DB_PATH=/data/chronoqueue.db
      - GRPC_ADDR=:9000
      - HTTP_ADDR=:8080
      - NZOVU_TLS_ENABLED=false
      - ENABLE_ENCRYPTION=true
      - ENCRYPTION_KEY_SOURCE_TYPE=LOCAL
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
      - ENABLE_API_DOCS=true
      - API_DOCS_CORS_ORIGINS=*
    networks:
      - nzovu-network
    volumes:
      - ${WORKSPACE_FOLDER}/certs:/secrets
      - sqlite-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  nzovu-ui:
    container_name: nzovu-ui
    hostname: nzovu-ui
    build:
      context: ..
      dockerfile: ./images/Dockerfile.sqlite
    entrypoint: ["/nzovu"]
    environment:
      - NZOVU_UI_AUTH_ENABLED=true
      - NZOVU_UI_AUTH_USERNAME=${NZOVU_UI_AUTH_USERNAME-${CHRONOQUEUE_UI_AUTH_USERNAME-}}
      - NZOVU_UI_AUTH_PASSWORD=${NZOVU_UI_AUTH_PASSWORD-${CHRONOQUEUE_UI_AUTH_PASSWORD-}}
      - NZOVU_UI_TLS_CERT_FILE=/secrets/server.crt
      - NZOVU_UI_TLS_KEY_FILE=/secrets/server.key
      - NZOVU_UI_PUBLIC_ORIGIN=https://localhost:8081
    command:
      - web-ui
      - start
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --grpc-address
      - nzovusvc:9000
      - --skip-ssl
    depends_on:
      - nzovusvc
    networks:
      - nzovu-network
    volumes:
      - ${WORKSPACE_FOLDER}/certs:/secrets:ro
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

networks:
  nzovu-network:
    name: ${NZOVU_NETWORK_NAME:-nzovu-network}
    driver: bridge

volumes:
  sqlite-data:
    driver: local
