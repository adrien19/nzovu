
services:
  nzovusvc:
    container_name: nzovu-server
    hostname: nzovu-server
    build:
      context: ..
      dockerfile: ./images/Dockerfile
    environment:
      - SERVER_MODE=development
      - STORAGE_TYPE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nzovu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nzovu_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-nzovu}
      - POSTGRES_SSLMODE=disable
      - GRPC_ADDR=:9000
      - HTTP_ADDR=:8080
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
      - NZOVU_TLS_ENABLED=false
      - ENABLE_ENCRYPTION=true
      - ENCRYPTION_KEY_SOURCE_TYPE=LOCAL
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
      - ENABLE_API_DOCS=true
      - API_DOCS_CORS_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nzovu-network
    volumes:
      - ../certs:/secrets:ro
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  nzovu-ui:
    container_name: nzovu-ui
    hostname: nzovu-ui
    build:
      context: ..
      dockerfile: ./images/Dockerfile
    entrypoint: ["/nzovu"]
    environment:
      - NZOVU_UI_AUTH_ENABLED=true
      - NZOVU_UI_AUTH_USERNAME=${NZOVU_UI_AUTH_USERNAME-}
      - NZOVU_UI_AUTH_PASSWORD=${NZOVU_UI_AUTH_PASSWORD-}
      - NZOVU_UI_TLS_CERT_FILE=/secrets/server.crt
      - NZOVU_UI_TLS_KEY_FILE=/secrets/server.key
      - NZOVU_UI_PUBLIC_ORIGIN=https://localhost:8081
    command:
      - web-ui
      - start
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --grpc-address
      - nzovusvc:9000
      - --skip-ssl
    depends_on:
      - nzovusvc
    networks:
      - nzovu-network
    volumes:
      - ../certs:/secrets:ro
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: nzovu-postgres
    hostname: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nzovu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nzovu_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-nzovu}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - nzovu-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pg_admin:
    image: dpage/pgadmin4:latest
    container_name: nzovu-pgadmin
    hostname: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadminData:/var/lib/pgadmin
    networks:
      - nzovu-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  nzovu-network:
    name: ${NZOVU_NETWORK_NAME:-nzovu-network}
    driver: bridge

volumes:
  postgres-data:
    driver: local
  pgadminData:
    driver: local
