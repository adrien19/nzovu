services:
  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: ai-orchestrator-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ai-orchestrator-network

  # AI Agent Orchestrator - Coordinator
  coordinator:
    build:
      context: ../..
      dockerfile: examples/ai-agent-orchestrator/Dockerfile
    container_name: ai-orchestrator-coordinator
    command: >
      /app/ai-orchestrator coordinator
      --workers 2
      --llm-provider ollama
      --llm-base-url http://ollama:11434
      --server nzovu:9000
      --insecure
      -v
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - NZOVU_SERVER=nzovu:9000
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama3.2:3b
    depends_on:
      ollama:
        condition: service_healthy
      nzovu:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-orchestrator-network

  # AI Agent Orchestrator - Mock Agents
  agents-mock:
    build:
      context: ../..
      dockerfile: examples/ai-agent-orchestrator/Dockerfile
    container_name: ai-orchestrator-agents-mock
    command: >
      /app/ai-orchestrator agents
      --web-search
      --code-analyzer
      --data-processor
      --aggregator
      --notification
      --workers 2
      --server nzovu:9000
      --insecure
      -v
    environment:
      - NZOVU_SERVER=nzovu:9000
    depends_on:
      nzovu:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-orchestrator-network

  # AI Agent Orchestrator - LLM Agents
  agents-llm:
    build:
      context: ../..
      dockerfile: examples/ai-agent-orchestrator/Dockerfile
    container_name: ai-orchestrator-agents-llm
    command: >
      /app/ai-orchestrator agents
      --llm-writer
      --llm-researcher
      --llm-coder
      --llm-provider ollama
      --llm-base-url http://ollama:11434
      --workers 2
      --server nzovu:9000
      --insecure
      -v
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - NZOVU_SERVER=nzovu:9000
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama3.2:3b
      - LLM_CODING_MODEL=qwen2.5-coder:7b
    depends_on:
      ollama:
        condition: service_healthy
      nzovu:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-orchestrator-network

  nzovu:
    build:
      context: ../..
      dockerfile: images/Dockerfile.sqlite
    environment:
      - SERVER_MODE=development
      - STORAGE_TYPE=sqlite
      - SQLITE_DB_PATH=/data/chronoqueue.db
      - GRPC_ADDR=:9000
      - HTTP_ADDR=:8080
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8080:8080"
    volumes:
      - nzovu_data:/data
    healthcheck:
      test: ["CMD", "/nzovu", "server", "health", "--http-server", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ai-orchestrator-network


volumes:
  nzovu_data:
  ollama_data:
    driver: local

networks:
  ai-orchestrator-network:
    driver: bridge
